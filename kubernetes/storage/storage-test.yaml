apiVersion: v1
kind: Pod

metadata:
  name: storage-test
  namespace: ecommerce

spec:
  containers:
    - name: storage-test
      image: busybox:1.36

      command:
        - sh
        - -c
        - "sleep 3600"

      volumeMounts:
        - name: postgres-storage
          mountPath: /data

  volumes:
    - name: postgres-storage
      persistentVolumeClaim:
        claimName: postgres-pvc
