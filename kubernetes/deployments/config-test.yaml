apiVersion: v1
kind: Pod

metadata:
  name: config-test
  namespace: ecommerce

spec:
  restartPolicy: Never

  containers:
    - name: config-test
      image: busybox:1.36

      command:
        - sleep
        - "3600"

      envFrom:
        - configMapRef:
            name: backend-config

        - secretRef:
            name: backend-secret
